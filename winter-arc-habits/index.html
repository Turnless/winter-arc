<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Winter Arc Habit Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A6FA5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #4A6FA5;
      --primary-light: #B4C7E7;
      --primary-dark: #2C4A7C;
      --bg: #F0F4F8;
      --card: #FFFFFF;
      --text: #1B2A4A;
      --text-light: #5A6A8A;
      --border: #D0D8E4;
      --success: #4CAF50;
      --success-light: #E8F5E9;
      --danger: #E53935;
      --danger-light: #FFEBEE;
      --accent: #7C4DFF;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .header-actions button {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .month-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .month-nav button {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
    }

    .month-nav span {
      font-size: 16px;
      font-weight: 600;
      min-width: 140px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--primary-light);
    }

    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .chart-container {
      position: relative;
      height: 180px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      text-align: center;
    }

    .stat-box {
      padding: 12px 8px;
      border-radius: 8px;
      background: var(--bg);
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .stat-box.success .stat-value { color: var(--success); }
    .stat-box.danger .stat-value { color: var(--danger); }

    .habit-grid-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 0 -16px;
      padding: 0 16px;
    }

    .habit-grid {
      min-width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .habit-grid th {
      background: var(--primary-light);
      color: var(--text);
      padding: 6px 4px;
      font-weight: 600;
      font-size: 11px;
      text-align: center;
      position: sticky;
      top: 0;
      white-space: nowrap;
    }

    .habit-grid th.habit-name-col {
      text-align: left;
      padding-left: 8px;
      min-width: 150px;
      position: sticky;
      left: 0;
      z-index: 2;
      background: var(--primary-light);
    }

    .habit-grid td {
      padding: 4px 2px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .habit-grid td.habit-name-cell {
      text-align: left;
      padding: 8px;
      font-weight: 500;
      font-size: 13px;
      white-space: nowrap;
      position: sticky;
      left: 0;
      background: var(--card);
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .habit-grid td.habit-name-cell .emoji {
      font-size: 16px;
    }

    .habit-grid td.habit-name-cell .habit-actions {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }

    .habit-grid td.habit-name-cell .habit-actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      opacity: 0.4;
      padding: 2px;
    }

    .habit-grid td.habit-name-cell .habit-actions button:hover {
      opacity: 1;
    }

    .day-cell {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      transition: all 0.15s;
    }

    .day-cell:hover {
      background: var(--primary-light);
    }

    .day-cell.completed {
      background: var(--success);
      color: white;
      font-weight: 700;
    }

    .day-cell.future {
      opacity: 0.3;
      cursor: default;
    }

    .day-cell.today {
      box-shadow: inset 0 0 0 2px var(--primary);
    }

    .week-separator {
      border-left: 2px solid var(--primary-light) !important;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-light);
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 14px;
      margin-bottom: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      border: none;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(74,111,165,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: transform 0.2s;
    }

    .fab:hover { transform: scale(1.1); }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 300;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--card);
      border-radius: 16px 16px 0 0;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal h2 {
      font-size: 18px;
      margin-bottom: 20px;
      color: var(--text);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-light);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    .emoji-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .emoji-option {
      width: 40px;
      height: 40px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .emoji-option:hover, .emoji-option.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      transform: scale(1.1);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .modal-actions .btn {
      flex: 1;
    }

    .notification-banner {
      background: var(--primary-light);
      color: var(--text);
      padding: 10px 16px;
      text-align: center;
      font-size: 13px;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .notification-banner.show { display: flex; }

    .notification-banner button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .charts-row {
        grid-template-columns: 1fr;
      }
      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    .weekly-progress {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .week-card {
      background: var(--bg);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }

    .week-card .week-label {
      font-size: 10px;
      color: var(--text-light);
      text-transform: uppercase;
    }

    .week-card .week-pct {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-top">
      <div>
        <h1>WINTER ARC</h1>
        <div style="font-size:11px;opacity:0.8;margin-top:2px">Sep 1 – Dec 31, 2026</div>
      </div>
      <div class="header-actions">
        <button onclick="enableNotifications()" title="Enable Notifications">🔔</button>
      </div>
    </div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">◀</button>
      <span id="currentMonth"></span>
      <button onclick="changeMonth(1)">▶</button>
    </div>
  </div>

  <div id="notifBanner" class="notification-banner">
    <span>🔔 Get reminded every 3 hours</span>
    <button onclick="enableNotifications()">Enable</button>
    <button onclick="dismissBanner()" style="background:transparent;color:var(--text)">✕</button>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-title">Overview</div>
      <div class="stats-grid">
        <div class="stat-box success">
          <div class="stat-value" id="statCompleted">0</div>
          <div class="stat-label">Completed</div>
        </div>
        <div class="stat-box danger">
          <div class="stat-value" id="statLeft">0</div>
          <div class="stat-label">Left</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="statPercent">0%</div>
          <div class="stat-label">Progress</div>
        </div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
      </div>
    </div>

    <div class="charts-row">
      <div class="card">
        <div class="card-title">Daily Trend</div>
        <div class="chart-container">
          <canvas id="trendChart"></canvas>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Monthly Progress</div>
        <div class="chart-container">
          <canvas id="donutChart"></canvas>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Weekly Breakdown</div>
      <div class="weekly-progress" id="weeklyProgress"></div>
    </div>

    <div class="card">
      <div class="card-title">Habits</div>
      <div id="habitGridContainer"></div>
    </div>
  </div>

  <button class="fab" onclick="openAddModal()">+</button>

  <div class="modal-overlay" id="habitModal">
    <div class="modal">
      <h2 id="modalTitle">Add Habit</h2>
      <div class="form-group">
        <label>Habit Name</label>
        <input type="text" id="habitName" placeholder="e.g. Wake up at 6AM" maxlength="30">
      </div>
      <div class="form-group">
        <label>Icon</label>
        <div class="emoji-picker" id="emojiPicker"></div>
      </div>
      <div class="form-group">
        <label>Goal (days per month)</label>
        <input type="number" id="habitGoal" placeholder="30" min="1" max="31" value="30">
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger" id="deleteBtn" onclick="deleteHabit()" style="display:none">Delete</button>
        <button class="btn btn-primary" id="saveBtn" onclick="saveHabit()">Save</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script>
    const EMOJIS = ['🌅','🏋️','📚','🧘','💧','🥗','📖','💰','🚭','📵','🚫','✨','🎯','💪','🧠','😴','🏃','🥗','🎨','✍️','🌍','🔥','⭐','🎵','🧹'];

    let db;
    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();
    let editingHabitId = null;
    let trendChart = null;
    let donutChart = null;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('WinterArcDB', 2);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('habits')) {
            const store = d.createObjectStore('habits', { keyPath: 'id', autoIncrement: true });
            store.createIndex('name', 'name', { unique: false });
          }
          if (!d.objectStoreNames.contains('completions')) {
            const store = d.createObjectStore('completions', { keyPath: 'id', autoIncrement: true });
            store.createIndex('habitId', 'habitId', { unique: false });
            store.createIndex('date', 'date', { unique: false });
            store.createIndex('habitDate', ['habitId', 'date'], { unique: true });
          }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = (e) => reject(e);
      });
    }

    function dbPut(store, data) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        const s = tx.objectStore(store);
        const req = data.id ? s.put(data) : s.add(data);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function dbGetAll(store) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function dbDelete(store, id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    function dbGetByIndex(store, indexName, value) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readonly');
        const idx = tx.objectStore(store).index(indexName);
        const req = idx.getAll(value);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function dateStr(y, m, d) {
      return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function getDaysInMonth(y, m) {
      return new Date(y, m + 1, 0).getDate();
    }

    function getFirstDayOfWeekMonBased(y, m) {
      const jsDay = new Date(y, m, 1).getDay();
      return (jsDay + 6) % 7;
    }

    function isToday(y, m, d) {
      const t = new Date();
      return t.getFullYear() === y && t.getMonth() === m && t.getDate() === d;
    }

    function isFuture(y, m, d) {
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      const check = new Date(y, m, d);
      return check > now;
    }

    function isBeforeWinterArc(y, m, d) {
      const check = new Date(y, m, d);
      const start = new Date(2026, 8, 1);
      return check < start;
    }

    function isAfterWinterArc(y, m, d) {
      const check = new Date(y, m, d);
      const end = new Date(2026, 11, 31);
      return check > end;
    }

    function updateMonthDisplay() {
      const months = ['January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'];
      document.getElementById('currentMonth').textContent = `${months[currentMonth]} ${currentYear}`;
    }

    function changeMonth(dir) {
      currentMonth += dir;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      if (currentYear === 2026 && currentMonth < 8) { currentMonth = 8; }
      if (currentYear === 2026 && currentMonth > 11) { currentMonth = 11; }
      updateMonthDisplay();
      renderAll();
    }

    function renderEmojiPicker(selected) {
      const picker = document.getElementById('emojiPicker');
      picker.innerHTML = EMOJIS.map(e =>
        `<div class="emoji-option ${e === selected ? 'selected' : ''}" onclick="selectEmoji('${e}', this)">${e}</div>`
      ).join('');
    }

    let selectedEmoji = '🎯';

    function selectEmoji(emoji, el) {
      selectedEmoji = emoji;
      document.querySelectorAll('.emoji-option').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
    }

    function openAddModal() {
      editingHabitId = null;
      document.getElementById('modalTitle').textContent = 'Add Habit';
      document.getElementById('habitName').value = '';
      document.getElementById('habitGoal').value = '30';
      document.getElementById('deleteBtn').style.display = 'none';
      document.getElementById('saveBtn').textContent = 'Save';
      selectedEmoji = '🎯';
      renderEmojiPicker(selectedEmoji);
      document.getElementById('habitModal').classList.add('active');
    }

    function openEditModal(habit) {
      editingHabitId = habit.id;
      document.getElementById('modalTitle').textContent = 'Edit Habit';
      document.getElementById('habitName').value = habit.name;
      document.getElementById('habitGoal').value = habit.goal;
      document.getElementById('deleteBtn').style.display = 'inline-flex';
      document.getElementById('saveBtn').textContent = 'Update';
      selectedEmoji = habit.emoji;
      renderEmojiPicker(selectedEmoji);
      document.getElementById('habitModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('habitModal').classList.remove('active');
      editingHabitId = null;
    }

    async function saveHabit() {
      const name = document.getElementById('habitName').value.trim();
      const goal = parseInt(document.getElementById('habitGoal').value) || 30;
      if (!name) { alert('Please enter a habit name'); return; }

      if (editingHabitId) {
        await dbPut('habits', { id: editingHabitId, name, emoji: selectedEmoji, goal });
      } else {
        await dbPut('habits', { name, emoji: selectedEmoji, goal, createdAt: Date.now() });
      }

      closeModal();
      renderAll();
    }

    async function deleteHabit() {
      if (!editingHabitId) return;
      if (!confirm('Delete this habit and all its data?')) return;

      const completions = await dbGetByIndex('completions', 'habitId', editingHabitId);
      for (const c of completions) {
        await dbDelete('completions', c.id);
      }
      await dbDelete('habits', editingHabitId);
      closeModal();
      renderAll();
    }

    async function toggleCompletion(habitId, day) {
      const d = dateStr(currentYear, currentMonth, day);
      if (isFuture(currentYear, currentMonth, day)) return;

      const existing = await dbGetByIndex('completions', 'habitDate', [habitId, d]);
      if (existing.length > 0) {
        await dbDelete('completions', existing[0].id);
      } else {
        await dbPut('completions', { habitId, date: d, completed: true });
      }
      renderAll();
    }

    async function renderAll() {
      const habits = await dbGetAll('habits');
      const allCompletions = await dbGetAll('completions');
      const daysInMonth = getDaysInMonth(currentYear, currentMonth);
      const today = new Date();
      const todayDate = dateStr(today.getFullYear(), today.getMonth(), today.getDate());

      const monthCompletions = allCompletions.filter(c => {
        const [y, m] = c.date.split('-').map(Number);
        return y === currentYear && m - 1 === currentMonth;
      });

      renderHabitGrid(habits, monthCompletions, daysInMonth);
      renderStats(habits, monthCompletions, daysInMonth);
      renderCharts(habits, monthCompletions, daysInMonth);
      renderWeeklyProgress(habits, monthCompletions, daysInMonth);
    }

    let habitsMap = {};

    function renderHabitGrid(habits, completions, daysInMonth) {
      const container = document.getElementById('habitGridContainer');
      habitsMap = {};
      for (const h of habits) habitsMap[h.id] = h;

      if (habits.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">🎯</div>
            <p>No habits yet. Start your Winter Arc by adding your first habit!</p>
            <button class="btn btn-primary" onclick="openAddModal()">+ Add Habit</button>
          </div>`;
        return;
      }

      const firstDayOffset = getFirstDayOfWeekMonBased(currentYear, currentMonth);
      const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

      let headerRow = '<tr><th class="habit-name-col">Habit</th>';
      for (let d = 1; d <= daysInMonth; d++) {
        const dow = (firstDayOffset + d - 1) % 7;
        const sepClass = (dow === 0 && d > 1) ? ' week-separator' : '';
        headerRow += `<th class="${sepClass}" title="${dayNames[dow]}">${dayNames[dow].substring(0,1)}${d}</th>`;
      }
      headerRow += '<th>Done</th></tr>';

      let bodyRows = '';
      for (const habit of habits) {
        const habitCompletions = completions.filter(c => c.habitId === habit.id);
        const completedDates = new Set(habitCompletions.map(c => c.date));
        let doneCount = 0;

        let row = `<tr><td class="habit-name-cell">
          <span class="emoji">${habit.emoji}</span>
          <span>${habit.name}</span>
          <span class="habit-actions">
            <button onclick="event.stopPropagation(); openEditModal(habitsMap[${habit.id}])" title="Edit">✏️</button>
          </span>
        </td>`;

        for (let d = 1; d <= daysInMonth; d++) {
          const ds = dateStr(currentYear, currentMonth, d);
          const completed = completedDates.has(ds);
          const future = isFuture(currentYear, currentMonth, d);
          const today = isToday(currentYear, currentMonth, d);
          const dow = (firstDayOffset + d - 1) % 7;
          const sepClass = (dow === 0 && d > 1) ? ' week-separator' : '';

          if (completed) doneCount++;

          let cls = 'day-cell';
          if (completed) cls += ' completed';
          if (future) cls += ' future';
          if (today) cls += ' today';

          row += `<td class="${sepClass}"><div class="${cls}" onclick="toggleCompletion(${habit.id}, ${d})">${completed ? '✓' : ''}</div></td>`;
        }

        row += `<td style="font-weight:700;font-size:13px">${doneCount}/${habit.goal}</td></tr>`;
        bodyRows += row;
      }

      container.innerHTML = `
        <div class="habit-grid-wrapper">
          <table class="habit-grid">
            <thead>${headerRow}</thead>
            <tbody>${bodyRows}</tbody>
          </table>
        </div>`;
    }

    function renderStats(habits, completions, daysInMonth) {
      let totalPossible = 0;
      let totalDone = 0;
      const today = new Date();
      const currentDate = today.getDate();

      for (const habit of habits) {
        const daysSoFar = (currentYear === today.getFullYear() && currentMonth === today.getMonth())
          ? currentDate : daysInMonth;
        totalPossible += Math.min(daysSoFar, habit.goal);
        const done = completions.filter(c => c.habitId === habit.id).length;
        totalDone += Math.min(done, habit.goal);
      }

      const left = Math.max(0, totalPossible - totalDone);
      const pct = totalPossible > 0 ? Math.round((totalDone / totalPossible) * 100) : 0;

      document.getElementById('statCompleted').textContent = totalDone;
      document.getElementById('statLeft').textContent = left;
      document.getElementById('statPercent').textContent = pct + '%';
      document.getElementById('progressBar').style.width = pct + '%';
    }

    function renderCharts(habits, completions, daysInMonth) {
      const dailyCounts = [];
      const dayLabels = [];
      for (let d = 1; d <= daysInMonth; d++) {
        const ds = dateStr(currentYear, currentMonth, d);
        const count = completions.filter(c => c.date === ds).length;
        dailyCounts.push(count);
        dayLabels.push(d);
      }

      const totalCompleted = dailyCounts.reduce((a, b) => a + b, 0);
      const totalPossible = habits.length * daysInMonth;
      const totalLeft = Math.max(0, totalPossible - totalCompleted);

      if (trendChart) trendChart.destroy();
      const trendCtx = document.getElementById('trendChart').getContext('2d');
      trendChart = new Chart(trendCtx, {
        type: 'line',
        data: {
          labels: dayLabels,
          datasets: [{
            label: 'Habits Done',
            data: dailyCounts,
            fill: true,
            backgroundColor: 'rgba(74,111,165,0.2)',
            borderColor: '#4A6FA5',
            borderWidth: 2,
            tension: 0.3,
            pointRadius: dailyCounts.length > 15 ? 0 : 3,
            pointBackgroundColor: '#4A6FA5'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            x: {
              display: true,
              ticks: { maxTicksLimit: 10, font: { size: 10 } },
              grid: { display: false }
            },
            y: {
              beginAtZero: true,
              ticks: { stepSize: 1, font: { size: 10 } },
              grid: { color: 'rgba(0,0,0,0.05)' }
            }
          }
        }
      });

      if (donutChart) donutChart.destroy();
      const donutCtx = document.getElementById('donutChart').getContext('2d');
      donutChart = new Chart(donutCtx, {
        type: 'doughnut',
        data: {
          labels: ['Completed', 'Remaining'],
          datasets: [{
            data: [totalCompleted, totalLeft],
            backgroundColor: ['#4A6FA5', '#E0E0E0'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '65%',
          plugins: {
            legend: {
              position: 'bottom',
              labels: { font: { size: 11 }, padding: 12 }
            }
          }
        }
      });
    }

    function renderWeeklyProgress(habits, completions, daysInMonth) {
      const container = document.getElementById('weeklyProgress');
      const firstDayOffset = getFirstDayOfWeekMonBased(currentYear, currentMonth);
      const weeks = [];

      const totalWeeks = Math.ceil((daysInMonth + firstDayOffset) / 7);
      for (let w = 0; w < totalWeeks; w++) {
        const start = w === 0 ? 1 : (w * 7) - firstDayOffset + 1;
        const end = Math.min(start + 6, daysInMonth);
        if (start > daysInMonth) break;

        let weekDone = 0;
        let weekTotal = 0;
        for (let d = start; d <= end; d++) {
          if (isFuture(currentYear, currentMonth, d)) continue;
          const ds = dateStr(currentYear, currentMonth, d);
          for (const habit of habits) {
            weekTotal++;
            if (completions.some(c => c.habitId === habit.id && c.date === ds)) {
              weekDone++;
            }
          }
        }

        const pct = weekTotal > 0 ? Math.round((weekDone / weekTotal) * 100) : 0;
        weeks.push(`<div class="week-card">
          <div class="week-label">Week ${w + 1}</div>
          <div class="week-pct">${pct}%</div>
        </div>`);
      }

      container.innerHTML = weeks.join('');
    }

    async function enableNotifications() {
      if (!('Notification' in window)) {
        alert('Notifications not supported in this browser');
        return;
      }

      const permission = await Notification.requestPermission();
      if (permission === 'granted') {
        document.getElementById('notifBanner').classList.remove('show');
        localStorage.setItem('notifEnabled', 'true');
        scheduleNotifications();
        new Notification('Winter Arc 🔔', { body: 'Notifications enabled! You will be reminded every 3 hours.' });
      }
    }

    function dismissBanner() {
      document.getElementById('notifBanner').classList.remove('show');
    }

    function scheduleNotifications() {
      if (localStorage.getItem('notifEnabled') !== 'true') return;

      setInterval(() => {
        if (Notification.permission === 'granted') {
          const hours = ['6AM', '9AM', '12PM', '3PM', '6PM', '9PM', '12AM'];
          const now = new Date();
          const h = now.getHours();
          const timeLabel = h < 6 ? 'Night' : h < 12 ? 'Morning' : h < 18 ? 'Afternoon' : 'Evening';

          new Notification(`Winter Arc - ${timeLabel} Check`, {
            body: 'Time to check off your habits! Stay consistent. 🔥',
            icon: 'icon-192.png',
            tag: 'winter-arc-reminder'
          });
        }
      }, 3 * 60 * 60 * 1000);
    }

    function init() {
      openDB().then(() => {
        currentYear = 2026;
        currentMonth = 8;
        updateMonthDisplay();
        renderEmojiPicker(selectedEmoji);
        renderAll();

        if (localStorage.getItem('notifEnabled') === 'true') {
          scheduleNotifications();
        } else if ('Notification' in window && Notification.permission === 'default') {
          document.getElementById('notifBanner').classList.add('show');
        }

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        }
      });
    }

    init();
  </script>
</body>
</html>
